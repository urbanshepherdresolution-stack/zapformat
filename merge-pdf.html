<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7TP5H35738"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge PDF Documents Online - ZapTextCleaner</title>
    <meta name="description" content="Combine multiple PDF files into one single document locally in your browser. 100% private with no server upload.">
    <link rel="canonical" href="https://zaptextcleaner.com/merge-pdf.html">

    <!-- pdf-lib CDN -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #172554;
            --dark: #0f172a;
            --light: #f8fafc;
            --border: #cbd5e1;
            --secondary: #64748b;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--light);
            color: var(--dark);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 650px;
            width: 100%;
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03);
        }
        h1 {
            font-size: 24px;
            color: var(--primary);
            margin-top: 0;
            text-align: center;
        }
        .desc {
            color: var(--secondary);
            font-size: 14px;
            text-align: center;
            margin-bottom: 25px;
        }
        .upload-area {
            border: 2px dashed #94a3b8;
            padding: 35px 20px;
            text-align: center;
            border-radius: 8px;
            background: #f1f5f9;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .upload-area:hover { border-color: var(--primary); }
        input[type="file"] { display: none; }
        .file-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 6px;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            font-size: 13px;
            border-bottom: 1px solid #f1f5f9;
        }
        .file-item:last-child { border-bottom: none; }
        .btn {
            background: var(--primary);
            color: #ffffff;
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
        }
        .btn:hover:not(:disabled) { background: var(--primary-hover); }
        .btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--secondary);
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 PDF Document Merger</h1>
    <p class="desc">Select multiple PDF files to combine them in sequential order. No data is transmitted to external servers.</p>

    <div class="upload-area" onclick="document.getElementById('pdf-input').click()">
        <div style="font-size: 34px; margin-bottom: 8px;">📄</div>
        <p style="margin: 0; font-weight: 600;">Click to select PDF files</p>
        <p style="margin: 5px 0 0 0; font-size: 12px; color: var(--secondary);">Select at least 2 PDF documents</p>
        <input type="file" id="pdf-input" accept="application/pdf" multiple>
    </div>

    <ul class="file-list" id="file-list" style="display: none;"></ul>

    <button class="btn" id="merge-btn" disabled onclick="mergePdfs()">Merge and Download PDF</button>

    <a href="index.html" class="back-link">← Return to Dashboard</a>
</div>

<script>
    let pdfFiles = [];

    document.getElementById('pdf-input').addEventListener('change', function(e) {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        pdfFiles = [...pdfFiles, ...files];
        renderFileList();
    });

    function renderFileList() {
        const listEl = document.getElementById('file-list');
        const btn = document.getElementById('merge-btn');

        if (pdfFiles.length === 0) {
            listEl.style.display = 'none';
            btn.disabled = true;
            return;
        }

        listEl.style.display = 'block';
        listEl.innerHTML = '';

        pdfFiles.forEach((file, idx) => {
            const li = document.createElement('li');
            li.className = 'file-item';
            li.innerHTML = `
                <span><strong>${idx + 1}.</strong> ${file.name}</span>
                <span style="color:#ef4444; cursor:pointer; font-weight:bold;" onclick="removePdf(${idx})">✕</span>
            `;
            listEl.appendChild(li);
        });

        btn.disabled = pdfFiles.length < 2;
    }

    function removePdf(idx) {
        pdfFiles.splice(idx, 1);
        renderFileList();
    }

    async function mergePdfs() {
        if (typeof PDFLib === 'undefined') {
            alert("Core PDF engine is initializing. Please try again in a few seconds.");
            return;
        }

        const btn = document.getElementById('merge-btn');
        btn.innerText = "Merging PDFs...";
        btn.disabled = true;

        try {
            const { PDFDocument } = PDFLib;
            const mergedPdf = await PDFDocument.create();

            for (const file of pdfFiles) {
                const buffer = await file.arrayBuffer();
                const pdf = await PDFDocument.load(buffer, { ignoreEncryption: true });
                const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                copiedPages.forEach(p => mergedPdf.addPage(p));
            }

            const pdfBytes = await mergedPdf.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'merged-document.pdf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        } catch (err) {
            console.error(err);
            alert("Could not merge the PDFs. One of the documents may be password protected.");
        }

        btn.innerText = "Merge and Download PDF";
        btn.disabled = false;
    }
</script>

</body>
</html>
