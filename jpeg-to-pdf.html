<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7TP5H35738"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-7TP5H35738');

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9973919593816896" crossorigin="anonymous"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPEG to PDF Converter - ZapTextCleaner</title>
    <meta name="description" content="Convert JPEG images to a single PDF document entirely in your browser memory. No files are uploaded to any server.">
    <link rel="canonical" href="https://zaptextcleaner.com/jpeg-to-pdf.html">

    <!-- Reliable jsPDF CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #172554;
            --dark: #0f172a;
            --light: #f8fafc;
            --border: #cbd5e1;
            --secondary: #64748b;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--light);
            color: var(--dark);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 650px;
            width: 100%;
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03);
        }
        h1 {
            font-size: 24px;
            color: var(--primary);
            margin-top: 0;
            text-align: center;
        }
        .desc {
            color: var(--secondary);
            font-size: 14px;
            text-align: center;
            margin-bottom: 25px;
        }
        .upload-area {
            border: 2px dashed #94a3b8;
            padding: 35px 20px;
            text-align: center;
            border-radius: 8px;
            background: #f1f5f9;
            cursor: pointer;
            margin-bottom: 20px;
            transition: border-color 0.2s;
        }
        .upload-area:hover { border-color: var(--primary); }
        input[type="file"] { display: none; }
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
            max-height: 180px;
            overflow-y: auto;
            padding: 5px;
        }
        .preview-thumb {
            width: 100%;
            height: 75px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .btn {
            background: var(--primary);
            color: #ffffff;
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.15s;
        }
        .btn:hover:not(:disabled) { background: var(--primary-hover); }
        .btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--secondary);
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <h1>🖼️ JPEG to PDF Converter</h1>
    <p class="desc">Select JPEG or JPG images to compile them into a unified PDF document. All processing takes place in your browser memory.</p>

    <div class="upload-area" onclick="document.getElementById('file-input').click()">
        <div style="font-size: 34px; margin-bottom: 8px;">📁</div>
        <p style="margin: 0; font-weight: 600;">Click to select JPEG files</p>
        <p style="margin: 5px 0 0 0; font-size: 12px; color: var(--secondary);">Supports multiple selections</p>
        <input type="file" id="file-input" accept="image/jpeg, image/jpg" multiple>
    </div>

    <div class="preview-grid" id="preview-grid"></div>

    <button class="btn" id="convert-btn" disabled onclick="convertImagesToPdf()">Convert and Download PDF</button>

    <a href="index.html" class="back-link">← Return to Dashboard</a>
</div>

<script>
    let loadedImages = [];

    document.getElementById('file-input').addEventListener('change', function(e) {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        loadedImages = [];
        const previewGrid = document.getElementById('preview-grid');
        previewGrid.innerHTML = '';
        const convertBtn = document.getElementById('convert-btn');
        convertBtn.disabled = true;

        let processed = 0;
        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    loadedImages.push({
                        element: img,
                        width: img.naturalWidth || 800,
                        height: img.naturalHeight || 600
                    });

                    const thumb = document.createElement('img');
                    thumb.src = event.target.result;
                    thumb.className = 'preview-thumb';
                    previewGrid.appendChild(thumb);

                    processed++;
                    if (processed === files.length) {
                        convertBtn.disabled = false;
                    }
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
    });

    function convertImagesToPdf() {
        if (!window.jspdf || !window.jspdf.jsPDF) {
            alert("PDF library is still initializing. Please wait 3 seconds and click again.");
            return;
        }

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF();
        const convertBtn = document.getElementById('convert-btn');
        convertBtn.innerText = "Compiling PDF...";
        convertBtn.disabled = true;

        try {
            loadedImages.forEach((imgData, idx) => {
                if (idx > 0) pdf.addPage();

                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();

                let w = imgData.width;
                let h = imgData.height;
                const ratio = Math.min(pageWidth / w, pageHeight / h);
                w *= ratio;
                h *= ratio;

                const x = (pageWidth - w) / 2;
                const y = (pageHeight - h) / 2;

                pdf.addImage(imgData.element, 'JPEG', x, y, w, h, undefined, 'FAST');
            });

            pdf.save('zap-images.pdf');
        } catch (err) {
            console.error(err);
            alert("Error generating PDF. Please ensure all uploaded files are valid JPEGs.");
        }

        convertBtn.innerText = "Convert and Download PDF";
        convertBtn.disabled = false;
    }
</script>

</body>
</html>
